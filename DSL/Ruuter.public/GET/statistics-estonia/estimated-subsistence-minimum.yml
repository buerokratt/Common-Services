declaration:
  call: declare
  version: 0.1
  name: "Estimated Subsistence Minimum"
  description: "Provides information about Estimated Subsistence Minimum"
  method: post
  returns: json
  namespace: common-services

prepareVariables:
  assign:
    chatId: ${incoming.params.chatId}
    authorId: ${incoming.params.authorId}
    lastYear: "${(new Date().getFullYear() - 1).toString()}" # YYYY - last year
  next: makeAPIRequest

makeAPIRequest:
  call: http.post
  args:
    url: "https://andmed.stat.ee/api/v1/en/stat/LE27"
    body:
      query:
        - code: "Näitaja"  # Ensure it's in quotes
          selection:
            filter: "item"
            values:
              - "1"  # Ensure it's a string
        - code: "Aasta"  # Ensure it's in quotes
          selection:
            filter: "item"
            values:
              - ${lastYear}  # Change to a string without decimal
      response:
        format: "json-stat2"
  result: subsistence
  next: assingResult

assingResult:
  assign:
    subsistenceMinimum: 
      res: ${subsistence.response.body.value[0]}
  next: formatMessages

formatMessages:
  call: http.post
  args:
    url: "[#DMAPPER]/common-services/hbs/bot_responses_to_messages"
    headers:
      type: json
    body:
      data:
        {
          "botMessages": "${[res]}",
          "chatId": "${chatId}",
          "authorId": "${authorId}",
          "authorFirstName": "",
          "authorLastName": "",
          "authorTimestamp": "${new Date().toISOString()}",
          "created": "${new Date().toISOString()}",
        }
  result: formatMessage

return_result:
  return: ${formatMessage.response.body}